name: Native A Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - native-a-wdac-build-20260916

jobs:
  build-native-a:
    runs-on: windows-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: pwsh
        working-directory: codex-rs

    env:
      RUST_MIN_STACK: 16777216

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy strict
        run: cargo clippy -p codex-app-server -p codex-app-server-protocol -p codex-utils-pty --all-targets -- -D warnings

      - name: Regenerate protocol schema fixtures
        run: |
          python .\app-server-protocol\scripts\write_schema_fixtures.py
          python .\app-server-protocol\scripts\write_schema_fixtures.py --experimental

      - name: App Server protocol tests
        run: cargo test -p codex-app-server-protocol

      - name: App Server library tests
        run: cargo test -p codex-app-server --lib

      - name: PTY tests
        run: cargo test -p codex-utils-pty

      - name: Build release codex.exe
        run: cargo build -p codex-cli --bin codex --release

      - name: SHA256
        run: |
          Get-FileHash ".\target\release\codex.exe" -Algorithm SHA256 | Format-List
          (Get-FileHash ".\target\release\codex.exe" -Algorithm SHA256).Hash |
            Out-File ".\target\release\codex.exe.sha256.txt" -Encoding ascii

      - name: Upload codex.exe
        uses: actions/upload-artifact@v4
        with:
          name: native-a-codex-windows-x64
          path: |
            codex-rs/target/release/codex.exe
            codex-rs/target/release/codex.exe.sha256.txt
          if-no-files-found: error

